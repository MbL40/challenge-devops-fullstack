name: CI

on:
  push:
    branches:
      - main
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: codebase/rdicidr-0.1.0
    steps:
      - name: checkout code
        uses: actions/checkout@v7
      - name: setup node
        uses: actions/setup-node@v7
        with:
          node-version-file: codebase/rdicidr-0.1.0/.nvmrc
      - name: install dependencies
        run: npm ci
      - name: run lint
        run: npm run lint
      - name: run unit tests
        run: CI=true npm run test
      - name: run build
        run: npm run build
